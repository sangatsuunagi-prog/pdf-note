<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PDFノート">
<meta name="theme-color" content="#f4f2ee">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>PDFノート</title>
<style>
:root{
  --bg:#f4f2ee; --panel:#ffffff; --line:#e3dfd8; --text:#2b2a28; --sub:#7b776f;
  --accent:#3d5a80; --accent-soft:#e3eaf3; --danger:#c0392b;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}

/* ---------- ホーム ---------- */
#home{min-height:100%;padding:calc(env(safe-area-inset-top) + 12px) 16px 40px}
.home-head{display:flex;align-items:center;gap:8px;max-width:1100px;margin:0 auto}
.home-head h1{font-size:22px;margin:0 auto 0 0;letter-spacing:.02em}
.btn{padding:9px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:15px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:active{opacity:.7}
#hint{max-width:1100px;margin:12px auto 0;padding:10px 14px;border-radius:10px;background:#fff7dc;border:1px solid #f0e2a8;font-size:14px;line-height:1.5}
#backupBar{max-width:1100px;margin:12px auto 0;padding:9px 14px;border-radius:10px;font-size:14px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);color:var(--sub)}
#backupBar.warn{background:#fdecea;border-color:#f3c3bd;color:#8a2c22}
#backupBar span{flex:1}
#backupBar button{padding:6px 12px;border-radius:8px;border:1px solid currentColor;font-size:13px;white-space:nowrap}
#crumbs{max-width:1100px;margin:16px auto 0;display:flex;align-items:center;gap:12px}
#crumbs .path{font-size:15px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#crumbs .path button{color:var(--accent);padding:4px 2px}
#crumbs .path button:last-child{color:var(--text);font-weight:600}
.card .thumb.folder{background:none;border:0;box-shadow:none;align-items:flex-end;padding:0 4px 6px}
.fold{position:relative;width:100%;height:72%;border-radius:4px 10px 10px 10px;background:color-mix(in srgb,var(--fc) 78%,black)}
.fold::before{content:'';position:absolute;left:0;top:-9%;width:44%;height:12%;border-radius:8px 8px 0 0;background:color-mix(in srgb,var(--fc) 78%,black)}
.fold::after{content:'';position:absolute;left:0;right:0;bottom:0;top:12%;border-radius:8px;background:var(--fc)}
.fold span{position:absolute;right:10px;bottom:8px;z-index:1;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.25)}
#notes{max-width:1100px;margin:16px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left}
.card .thumb{aspect-ratio:3/4;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card .thumb img{width:100%;height:100%;object-fit:contain}
.card .t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:28px}
.card .m{font-size:12px;color:var(--sub)}
.card .more{position:absolute;right:0;bottom:14px;width:30px;height:30px;border-radius:8px;font-size:18px;color:var(--sub)}
/* 複数選択 */
#home.selecting .home-head .hide-sel{display:none}
#home.selecting{padding-bottom:calc(env(safe-area-inset-bottom) + 90px)}
.card .chk{display:none;position:absolute;left:6px;top:6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);box-shadow:0 0 0 1px rgba(0,0,0,.2);color:#fff;font-size:15px;line-height:22px;text-align:center;pointer-events:none;z-index:2}
#home.selecting .card .chk{display:block}
#home.selecting .card .more{display:none}
.card.sel .chk{background:var(--accent)}
.card.sel .thumb{outline:3px solid var(--accent);outline-offset:2px}
#selBar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(0,0,0,.08);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);display:flex;align-items:center;gap:8px}
#selBar .cnt{flex:1;font-size:15px;font-weight:600}
#selBar .btn:disabled{opacity:.35}
#selBar .btn.danger{color:var(--danger)}
body.selecting #toast{bottom:calc(env(safe-area-inset-bottom) + 86px)}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:60px 0;line-height:1.8}

/* ---------- エディタ ---------- */
#editor{position:fixed;inset:0;display:flex;flex-direction:column;background:#e9e6e1}
.ebar{background:var(--panel);border-bottom:1px solid var(--line);padding:6px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ebar.top{padding-top:calc(env(safe-area-inset-top) + 6px)}
.ib{min-width:40px;height:38px;padding:0 10px;border-radius:9px;font-size:15px;white-space:nowrap}
.ib:active{background:var(--accent-soft)}
.ib:disabled{opacity:.3}
.ib.on{background:var(--accent);color:#fff}
#etitle{flex:1;min-width:60px;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.grp{display:flex;align-items:center;gap:3px;padding:0 6px;border-left:1px solid var(--line)}
.grp:first-child{border-left:0;padding-left:0}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.sz{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.sz i{display:block;border-radius:50%;background:var(--text)}
.sz.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.al{width:30px;height:24px;border-radius:6px;border:1px solid var(--line)}
.al.on{box-shadow:0 0 0 2px var(--accent)}
.hinttxt{font-size:13px;color:var(--sub);padding:0 6px}
.preset{height:30px;padding:0 8px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;gap:5px;font-size:12px;background:#fff}
.preset i{display:block;border-radius:50%}
#scroller{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
#pages{display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px 12px 60px;min-width:100%;width:max-content}
.page{position:relative;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);flex:none;-webkit-touch-callout:none}
.page canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.page canvas.hl{mix-blend-mode:multiply}
.er-cursor{position:absolute;border:1.5px solid rgba(60,60,60,.6);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);background:rgba(255,255,255,.3)}
.sel-box{position:absolute;border:1.5px dashed var(--accent);background:rgba(61,90,128,.06);pointer-events:none}
.sel-menu{position:absolute;display:flex;gap:4px;transform:translateY(-100%);padding-bottom:6px;z-index:2}
.sel-menu button{background:var(--text);color:#fff;border-radius:8px;padding:6px 12px;font-size:14px}
#pageno{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);background:rgba(43,42,40,.7);color:#fff;font-size:13px;padding:4px 10px;border-radius:999px;pointer-events:none}

/* ページ一覧 */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(300px,85vw);background:var(--panel);box-shadow:-4px 0 16px rgba(0,0,0,.15);display:flex;flex-direction:column;z-index:20}
#panel .ph{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;border-bottom:1px solid var(--line)}
#panel .ph b{flex:1}
#plist{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
.pi{display:flex;gap:10px;align-items:flex-start}
.pi .pimg{width:110px;flex:none;background:#fff;border:1px solid var(--line);border-radius:4px;min-height:60px}
.pi.cur .pimg{outline:2px solid var(--accent)}
.pi img{display:block;width:100%}
.pi .pb{display:flex;flex-direction:column;gap:4px;font-size:13px}
.pi .pb button{border:1px solid var(--line);border-radius:7px;padding:4px 8px;text-align:left}

/* シート・モーダル */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:var(--panel);border-radius:14px;width:min(380px,100%);max-height:85vh;overflow:auto;padding:8px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet h3{font-size:15px;margin:10px 12px 8px;color:var(--sub);font-weight:600}
.sheet .item{display:block;width:100%;text-align:left;padding:13px 12px;border-radius:9px;font-size:16px}
.sheet .item:active{background:var(--accent-soft)}
.sheet .item.danger{color:var(--danger)}
.sheet .item.cancel{text-align:center;color:var(--sub)}
.sheet .body{padding:4px 12px 10px;font-size:15px;line-height:1.7}
.sheet .preview{display:block;max-width:100%;max-height:50vh;margin:6px auto 10px;border:1px solid var(--line);background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px}
.sheet .row{display:flex;gap:8px;padding:4px 8px 8px}
.sheet .row .btn{flex:1;text-align:center}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;z-index:100}
#busy div{background:var(--text);color:#fff;padding:12px 20px;border-radius:12px;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:120;pointer-events:none}
</style>
</head>
<body>

<div id="home">
  <div class="home-head">
    <h1>PDFノート</h1>
    <button class="btn primary hide-sel" id="importBtn">PDFを読み込む</button>
    <button class="btn hide-sel" id="newBtn">空白ノート</button>
    <button class="btn hide-sel" id="newFolderBtn">＋フォルダ</button>
    <button class="btn" id="selectBtn">選択</button>
    <button class="btn hide-sel" id="homeMenu" aria-label="メニュー">⋯</button>
  </div>
  <div id="hint" hidden>
    <b>ホーム画面に追加してください。</b>Safariは、しばらく開かないサイトの保存データを消すことがあります。共有ボタン →「ホーム画面に追加」で、アプリとして使うとデータが消えにくくなります。ときどき「⋯ → バックアップを書き出す」もしておくと安心です。
  </div>
  <div id="backupBar" hidden></div>
  <div id="crumbs" hidden></div>
  <div id="notes"></div>
  <div id="selBar" hidden>
    <span class="cnt" id="selCount"></span>
    <button class="btn" id="selAll">すべて選択</button>
    <button class="btn" id="selMove">フォルダへ移動</button>
    <button class="btn danger" id="selDel">削除</button>
  </div>
  <input type="file" id="pdfInput" accept="application/pdf,.pdf" multiple hidden>
  <input type="file" id="restoreInput" hidden>
</div>

<div id="editor" hidden>
  <div class="ebar top">
    <button class="ib" id="backBtn">‹ 一覧</button>
    <div id="etitle"></div>
    <button class="ib" id="undoBtn" aria-label="元に戻す">↶ 戻す</button>
    <button class="ib" id="redoBtn" aria-label="やり直す">↷</button>
    <button class="ib" id="addPageBtn">＋ページ</button>
    <button class="ib" id="pagesBtn">ページ一覧</button>
    <button class="ib" id="editorMenu" aria-label="メニュー">⋯</button>
  </div>
  <div class="ebar" id="opts"></div>
  <div id="scroller"><div id="pages"></div></div>
  <div id="pageno"></div>
</div>

<div id="panel" hidden>
  <div class="ph"><b>ページ一覧</b><button class="ib" id="addLastBtn">＋最後に追加</button><button class="ib" id="panelClose">閉じる</button></div>
  <div id="plist"></div>
</div>

<div id="busy" hidden><div id="busyMsg"></div></div>
<div id="toast" hidden></div>

<script src="vendor/pdfjs/build/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const r2 = v => Math.round(v * 100) / 100;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdfjs/build/pdf.worker.min.js';
const PDFJS_OPTS = { cMapUrl: 'vendor/pdfjs/cmaps/', cMapPacked: true, standardFontDataUrl: 'vendor/pdfjs/standard_fonts/' };

// ---------- 定数 ----------
const COLORS = ['#1a1a1a','#757575','#e53935','#b71c1c','#fb8c00','#ffd600','#aeea00','#2e7d32',
                '#00897b','#29b6f6','#1e5bd8','#1a237e','#8e24aa','#ec407a','#795548','#b39ddb'];
const PEN_W = [0.8, 1.4, 2.2, 3.2, 4.8];      // ペンの太さ(pt)
const HL_W  = [6, 10, 14, 19, 26];            // 蛍光ペンの太さ(pt)
const HL_A  = [0.15, 0.25, 0.35, 0.45, 0.6];  // 蛍光ペンの濃さ
const ER_W  = [6, 12, 20, 30, 44];            // 消しゴムの直径(pt)
const PAPERS = {
  'ruled-s': { name: '罫線(狭い)', kind: 'ruled', sp: 17 },
  'ruled-m': { name: '罫線(普通)', kind: 'ruled', sp: 20 },
  'ruled-l': { name: '罫線(広い)', kind: 'ruled', sp: 24 },
  'grid':    { name: '方眼', kind: 'grid', sp: 14.17 },
  'plain':   { name: '無地', kind: 'plain' },
};
const A4 = { w: 595.28, h: 841.89 };
const LINE_GRAY = '#cfcfcf';
const MAXPX = 8e6;   // 1枚のキャンバスの最大ピクセル数(iPadのメモリ対策)
const MAGIC = 'PDFNOTE1';
const SMOOTH = 0.55;  // 線をならす強さ(1でならさない、小さいほどなめらかだが遅れる)

// ---------- 設定(端末ごと) ----------
const SET_KEY = 'pdfnote-settings';
const set = Object.assign({ tool: 'pen', pen: { c: 0, s: 1 }, hl: { c: 5, s: 2, a: 2 }, er: { s: 2 }, presets: [], finger: false }, loadSet());
function loadSet() { try { return JSON.parse(localStorage.getItem(SET_KEY)) || {}; } catch { return {}; } }
function saveSet() { try { localStorage.setItem(SET_KEY, JSON.stringify(set)); } catch {} }

// ---------- IndexedDB ----------
const DB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('pdfnote', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('folders', { keyPath: 'id' });
      d.createObjectStore('notes', { keyPath: 'id' });
      d.createObjectStore('pdfs', { keyPath: 'id' });
      d.createObjectStore('ink', { keyPath: 'pageId' });
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
  const tx = (store, mode, fn) => new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && req.result);
    t.onerror = t.onabort = () => rej(t.error);
  });
  return {
    open,
    get: (st, k) => tx(st, 'readonly', s => s.get(k)),
    all: st => tx(st, 'readonly', s => s.getAll()),
    put: (st, v) => tx(st, 'readwrite', s => s.put(v)),
    del: (st, k) => tx(st, 'readwrite', s => s.delete(k)),
    putMany: (st, arr) => tx(st, 'readwrite', s => { arr.forEach(v => s.put(v)); }),
    delMany: (st, keys) => tx(st, 'readwrite', s => { keys.forEach(k => s.delete(k)); }),
  };
})();

// ---------- 小さな部品 ----------
function busy(msg) { $('#busy').hidden = !msg; if (msg) $('#busyMsg').textContent = msg; }
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2000); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function sheet(title, items, body) {
  const bg = el('div', 'sheet-bg'), box = el('div', 'sheet');
  const close = () => bg.remove();
  if (title) box.append(el('h3', null, title));
  if (body) box.append(body);
  for (const it of items) {
    const b = el('button', 'item' + (it.danger ? ' danger' : ''), it.label);
    b.onclick = () => { if (!it.keep) close(); it.fn(); };
    box.append(b);
  }
  const c = el('button', 'item cancel', '閉じる'); c.onclick = close; box.append(c);
  bg.onclick = e => { if (e.target === bg) close(); };
  bg.append(box); document.body.append(bg);
  return close;
}

async function shareFile(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return true; }
    catch (e) { if (e.name === 'AbortError') return false; }
  }
  const a = el('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  return true;
}
// 時間のかかる処理のあとは、ボタンを押してもらってから共有する(Safariの制限)
function readySheet(title, blob, name, onDone, body) {
  sheet(title, [{ label: '共有・保存する', fn: async () => { if (await shareFile(blob, name) && onDone) onDone(); } }], body);
}
const safeName = s => (s || 'ノート').replace(/[\\/:*?"<>|]/g, '_');
const fmtDate = t => { const d = new Date(t); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };

// ---------- PDF文書の読み込み ----------
const docCache = new Map();
function getDoc(pdfId) {
  if (!docCache.has(pdfId)) {
    docCache.set(pdfId, DB.get('pdfs', pdfId).then(rec => {
      if (!rec) throw new Error('PDFデータが見つかりません');
      return pdfjsLib.getDocument({ data: new Uint8Array(rec.data.slice(0)), ...PDFJS_OPTS }).promise;
    }));
  }
  return docCache.get(pdfId);
}
function clearDocs() { for (const p of docCache.values()) p.then(d => d.destroy()).catch(() => {}); docCache.clear(); }

// ---------- 描画(画面・切り取り・書き出しで共通) ----------
function drawPaper(ctx, pg, paperKey) {
  const p = PAPERS[paperKey] || PAPERS['ruled-m'];
  if (p.kind === 'plain') return;
  ctx.save(); ctx.strokeStyle = LINE_GRAY; ctx.lineWidth = p.kind === 'grid' ? 0.4 : 0.6;
  ctx.beginPath();
  if (p.kind === 'ruled') {
    for (let y = p.sp * 2.5; y < pg.h - p.sp; y += p.sp) { ctx.moveTo(0, y); ctx.lineTo(pg.w, y); }
  } else {
    for (let y = p.sp; y < pg.h; y += p.sp) { ctx.moveTo(0, y); ctx.lineTo(pg.w, y); }
    for (let x = p.sp; x < pg.w; x += p.sp) { ctx.moveTo(x, 0); ctx.lineTo(x, pg.h); }
  }
  ctx.stroke(); ctx.restore();
}
function paperLines(pg, paperKey) {  // PDF書き出し用
  const p = PAPERS[paperKey] || PAPERS['ruled-m'], out = [];
  if (p.kind === 'ruled') for (let y = p.sp * 2.5; y < pg.h - p.sp; y += p.sp) out.push([0, y, pg.w, y]);
  if (p.kind === 'grid') {
    for (let y = p.sp; y < pg.h; y += p.sp) out.push([0, y, pg.w, y]);
    for (let x = p.sp; x < pg.w; x += p.sp) out.push([x, 0, x, pg.h]);
  }
  return out;
}
// 点と点を Catmull-Rom 曲線でなめらかにつなぐ(全部の点を通る3次ベジェに変換)
function pathD(p) {
  const n = p.length / 2;
  let d = `M${p[0]} ${p[1]}`;
  if (n === 2) return d + ` L${p[2]} ${p[3]}`;
  const X = i => p[2 * clamp(i, 0, n - 1)], Y = i => p[2 * clamp(i, 0, n - 1) + 1];
  for (let i = 0; i < n - 1; i++) {
    d += ` C${r2(X(i) + (X(i + 1) - X(i - 1)) / 6)} ${r2(Y(i) + (Y(i + 1) - Y(i - 1)) / 6)}`
       + ` ${r2(X(i + 1) - (X(i + 2) - X(i)) / 6)} ${r2(Y(i + 1) - (Y(i + 2) - Y(i)) / 6)} ${X(i + 1)} ${Y(i + 1)}`;
  }
  return d;
}
const pathCache = new WeakMap();
function strokePath(s) { let p = pathCache.get(s); if (!p) { p = new Path2D(pathD(s.p)); pathCache.set(s, p); } return p; }
function drawStroke(ctx, s) {
  ctx.save();
  ctx.globalAlpha = s.t === 'h' ? s.a : 1;
  ctx.strokeStyle = ctx.fillStyle = s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (s.p.length === 2) { ctx.beginPath(); ctx.arc(s.p[0], s.p[1], s.w / 2, 0, Math.PI * 2); ctx.fill(); }
  else ctx.stroke(strokePath(s));
  ctx.restore();
}
// 書き込みは2枚の画像に分けて描く。
// 蛍光ペン(kind='h'):下の文字が黒いまま透けるよう「乗算」で重ねる画像に描く
// ペン(kind='p'):色がそのまま見えるよう普通に重ねる画像に描く(蛍光ペンより上)
// c はページの (x, y) から幅 w(pt)の範囲を表す画像
function paintLayer(c, strokes, kind, x, y, w) {
  const ctx = c.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height);
  if (!c.width) return;
  const k = c.width / w; ctx.setTransform(k, 0, 0, k, -x * k, -y * k);
  for (const s of strokes) if ((s.t === 'h') === (kind === 'h')) drawStroke(ctx, s);
}
function sizeCanvas(c, w, h) { if (c.width !== w || c.height !== h) { c.width = w; c.height = h; } }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
// ページ(またはその一部)を背景+書き込みで1枚の画像にする
async function renderPageImage(pg, strokes, paperKey, k, reg) {
  reg = reg || { x: 0, y: 0, w: pg.w, h: pg.h };
  const c = mkCanvas(reg.w * k, reg.h * k), ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  if (pg.type === 'pdf') {
    const page = await (await getDoc(pg.pdf)).getPage(pg.n);
    const vp = page.getViewport({ scale: k, offsetX: -reg.x * k, offsetY: -reg.y * k });
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
  } else {
    ctx.setTransform(k, 0, 0, k, -reg.x * k, -reg.y * k); drawPaper(ctx, pg, paperKey);
  }
  const hl = mkCanvas(c.width, c.height);
  paintLayer(hl, strokes, 'h', reg.x, reg.y, reg.w);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(hl, 0, 0); ctx.globalCompositeOperation = 'source-over';
  hl.width = hl.height = 0;
  ctx.setTransform(k, 0, 0, k, -reg.x * k, -reg.y * k);
  for (const s of strokes) if (s.t !== 'h') drawStroke(ctx, s);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  return c;
}

// ================= ホーム =================
// curFolder: 今開いているフォルダのid(null = ホーム)。フォルダの中にフォルダも作れる
let folders = [], notes = [], curFolder = null;
const FOLDER_COLORS = ['#6f8fbf', '#5fa58a', '#d39a4a', '#c76b6b', '#9a7cc0', '#8a8a8a'];
const folderById = id => (id && folders.find(f => f.id === id)) || null;
const parentOf = f => folderById(f.parentId) ? f.parentId : null;
const noteFolder = n => folderById(n.folderId) ? n.folderId : null;
function folderPath(id) {
  const out = []; let f;
  while ((f = folderById(id)) && !out.includes(f)) { out.unshift(f); id = parentOf(f); }
  return out;
}
const folderLabel = f => folderPath(f.id).map(x => x.name).join(' › ');
function isInside(id, ancestorId) { return folderPath(id).some(f => f.id === ancestorId); }

async function refreshHome() {
  folders = await DB.all('folders');
  notes = await DB.all('notes');
  if (!folderById(curFolder)) curFolder = null;
  renderHome();
}
function goFolder(id) { curFolder = id; selected.clear(); renderHome(); window.scrollTo(0, 0); }

// 複数選択(「選択」ボタン)。キーは 'n:ノートid' / 'f:フォルダid'
let selecting = false;
const selected = new Set();
function setSelecting(on) {
  selecting = on; selected.clear();
  $('#home').classList.toggle('selecting', on);
  document.body.classList.toggle('selecting', on);
  $('#selectBtn').textContent = on ? '完了' : '選択';
  $('#selBar').hidden = !on;
  renderHome();
}
function toggleSel(key, card) {
  if (selected.has(key)) selected.delete(key); else selected.add(key);
  card.classList.toggle('sel', selected.has(key));
  updateSelBar();
}
function shownKeys() {
  return [...folders.filter(f => parentOf(f) === curFolder).map(f => 'f:' + f.id),
          ...notes.filter(n => noteFolder(n) === curFolder).map(n => 'n:' + n.id)];
}
function updateSelBar() {
  if (!selecting) return;
  const keys = shownKeys();
  for (const k of [...selected]) if (!keys.includes(k)) selected.delete(k);
  $('#selCount').textContent = selected.size ? `${selected.size}件 選択中` : 'タップして選択';
  $('#selAll').textContent = keys.length && selected.size === keys.length ? '選択を解除' : 'すべて選択';
  $('#selAll').disabled = !keys.length;
  $('#selMove').disabled = $('#selDel').disabled = !selected.size;
}
function selItems() {
  const ids = k => [...selected].filter(s => s.startsWith(k)).map(s => s.slice(2));
  return { ns: notes.filter(n => ids('n:').includes(n.id)), fs: folders.filter(f => ids('f:').includes(f.id)) };
}
function countLabel(ns, fs) { return [fs.length && `フォルダ${fs.length}個`, ns.length && `ノート${ns.length}冊`].filter(Boolean).join('と'); }
function moveSelected() {
  const { ns, fs } = selItems();
  if (!ns.length && !fs.length) return;
  const items = [{ label: 'ホーム(フォルダの外)', fn: () => done(null) }];
  folders.filter(f => !fs.some(x => isInside(f.id, x.id)))
    .map(f => [folderLabel(f), f]).sort((a, b) => a[0].localeCompare(b[0], 'ja'))
    .forEach(([label, f]) => items.push({ label, fn: () => done(f.id) }));
  sheet(`${countLabel(ns, fs)}の移動先`, items);
  async function done(fid) {
    await DB.putMany('notes', ns.map(n => ({ ...n, folderId: fid })));
    await DB.putMany('folders', fs.map(f => ({ ...f, parentId: fid })));
    selected.clear(); await refreshHome(); toast(`${countLabel(ns, fs)}を移動しました`);
  }
}
async function deleteSelected() {
  const { ns, fs } = selItems();
  if (!ns.length && !fs.length) return;
  let msg = `${countLabel(ns, fs)}を削除しますか？`;
  if (ns.length) msg += '\nノートは書き込みも消え、元に戻せません。';
  if (fs.length) msg += '\nフォルダの中身は消えずに、ひとつ外に出ます。';
  if (!confirm(msg)) return;
  busy('削除中…');
  try {
    if (ns.length) await removeNotes(ns);
    // フォルダは中身をひとつ外へ出してから消す(選んだフォルダ同士が親子でも、消えない場所まで出す)
    const gone = new Set(fs.map(f => f.id));
    const upOf = id => { let f = folderById(id); while (f && gone.has(f.id)) f = folderById(parentOf(f)); return f ? f.id : null; };
    const left = notes.filter(n => !ns.includes(n));
    await DB.putMany('notes', left.filter(n => gone.has(noteFolder(n))).map(n => ({ ...n, folderId: upOf(n.folderId) })));
    await DB.putMany('folders', folders.filter(x => !gone.has(x.id) && gone.has(parentOf(x))).map(x => ({ ...x, parentId: upOf(x.parentId) })));
    await DB.delMany('folders', [...gone]);
  } finally { busy(false); }
  selected.clear(); await refreshHome(); toast('削除しました');
}

    : `最後のバックアップ:${fmtDate(last)}(${days === 0 ? '今日' : days + '日前'})`;

}

    th.onclick = tap(card, 'f:' + f.id, () => goFolder(f.id));

    chk(card, 'f:' + f.id);
    box.append(card);
  }
  for (const n of list) {

    const th = el('button', 'thumb');
    if (n.thumb) { const img = el('img'); img.src = n.thumb; img.alt = ''; th.append(img); }
    th.onclick = tap(card, 'n:' + n.id, () => openNote(n.id));

function chooseFolder(title, exclude, done) {
  const items = [{ label: 'ホーム(フォルダの外)', fn: () => done(null) }];
  folders.filter(f => !exclude || !isInside(f.id, exclude))

async function deleteNote(n) {
  if (!confirm(`「${n.title}」を削除しますか？\n書き込みも消え、元に戻せません。`)) return;

  refreshHome(); toast('削除しました');
}
// ノートと書き込みを消す。PDFは他のノートで使われていなければ消す
async function removeNotes(ns) {
  const ids = new Set(ns.map(n => n.id));
  await DB.delMany('ink', ns.flatMap(n => n.pages.map(p => p.id)));
  const used = new Set(notes.filter(o => !ids.has(o.id)).flatMap(o => o.pages.map(p => p.pdf)));
  const pdfIds = [...new Set(ns.flatMap(n => n.pages).filter(p => p.pdf && !used.has(p.pdf)).map(p => p.pdf))];
  await DB.delMany('pdfs', pdfIds);
  await DB.delMany('notes', [...ids]);
}

async function importPDFs(files) {
  navigator.storage?.persist?.();
  let lastId = null;
  for (let fi = 0; fi < files.length; fi++) {
    const file = files[fi];
    try {
      busy(`読み込み中… ${file.name}`);
      const buf = await file.arrayBuffer();
      const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)), ...PDFJS_OPTS }).promise;
      const pdfId = uid(), pages = [];
      for (let i = 1; i <= doc.numPages; i++) {
        const page = await doc.getPage(i); const vp = page.getViewport({ scale: 1 });
        pages.push({ id: uid(), type: 'pdf', pdf: pdfId, n: i, w: r2(vp.width), h: r2(vp.height) });
        page.cleanup();
      }
      doc.destroy();
      await DB.put('pdfs', { id: pdfId, data: buf });
      const now = Date.now();
      const note = { id: uid(), title: file.name.replace(/\.pdf$/i, ''), folderId: curFolder,
                     paper: 'ruled-m', pages, created: now, updated: now, thumb: null };
      try { note.thumb = (await renderPageImage(pages[0], [], note.paper, 240 / pages[0].w)).toDataURL('image/jpeg', 0.75); } catch {}
      await DB.put('notes', note);
      lastId = note.id;
    } catch (e) {
      console.error(e); alert(`「${file.name}」を読み込めませんでした。\n${e.message || e}`);
    }
  }
  clearDocs(); busy(false); await refreshHome();
  if (files.length === 1 && lastId) openNote(lastId);
}

// ---------- バックアップ ----------
async function exportBackup() {
  try {
    busy('バックアップを作っています…');
    const [fo, no, ink, pdfs] = await Promise.all(['folders', 'notes', 'ink', 'pdfs'].map(s => DB.all(s)));
    const head = { v: 1, folders: fo, notes: no, ink, pdfs: pdfs.map(p => ({ id: p.id, size: p.data.byteLength })) };
    const hb = new TextEncoder().encode(JSON.stringify(head));
    const len = new Uint8Array(4); new DataView(len.buffer).setUint32(0, hb.length);
    const blob = new Blob([MAGIC, len, hb, ...pdfs.map(p => p.data)], { type: 'application/octet-stream' });
    const d = new Date();
    busy(false);
    const tip = el('div', 'body', '「共有・保存する」→「"ファイル"に保存」で保存先を選びます。iPadが壊れたりなくしたりしても残るよう、「iCloud Drive」やGoogleドライブがおすすめです。');
    readySheet(`バックアップができました(${(blob.size / 1048576).toFixed(1)}MB)`, blob,
      `pdfnote-backup-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.pdfnote`,
      () => { set.lastBackup = Date.now(); saveSet(); renderBackupBar(); toast('バックアップを保存しました'); }, tip);
  } catch (e) { busy(false); alert('バックアップに失敗しました: ' + e.message); }
}
async function restoreBackup(file) {
  try {
    const buf = await file.arrayBuffer();
    if (new TextDecoder().decode(new Uint8Array(buf, 0, 8)) !== MAGIC) { alert('PDFノートのバックアップファイルではありません'); return; }
    const hl = new DataView(buf, 8, 4).getUint32(0);
    const head = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 12, hl)));
    if (!confirm(`ノート${head.notes.length}冊を復元します。\n同じノートがある場合は、バックアップの内容で上書きされます。`)) return;
    busy('復元しています…');
    let off = 12 + hl;
    const pdfs = head.pdfs.map(p => { const data = buf.slice(off, off + p.size); off += p.size; return { id: p.id, data }; });
    await DB.putMany('pdfs', pdfs);
    await DB.putMany('ink', head.ink);

// ---------- PDF書き出し ----------
const hexRgb = h => PDFLib.rgb(parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255);
async function inkOfPage(id) {
  if (cur.note && inkMap.has(id)) return inkMap.get(id);
  const r = await DB.get('ink', id); return r ? r.strokes : [];
}
function drawStrokesPdf(page, strokes, ox, top) {
  const L = PDFLib;
  page.pushOperators(L.pushGraphicsState(), L.setLineJoin(L.LineJoinStyle.Round));
  const order = [...strokes.filter(s => s.t === 'h'), ...strokes.filter(s => s.t !== 'h')];
  for (const s of order) {
    const col = hexRgb(s.c), hl = s.t === 'h';

      if (hl) o.blendMode = L.BlendMode.Multiply;

    const o = { x: ox, y: top, borderColor: col, borderWidth: s.w, borderOpacity: hl ? s.a : 1, borderLineCap: L.LineCapStyle.Round };

  const L = PDFLib, inEditor = !!cur.note;

    const out = await L.PDFDocument.create(), srcs = new Map();

      busy(`PDFを作っています… ${i + 1}/${n.pages.length}`);
      const pg = n.pages[i], strokes = await inkOfPage(pg.id);
      if (pg.type === 'pdf') {
        const pj = await (await getDoc(pg.pdf)).getPage(pg.n);
        if (pj.rotate % 360 === 0) {
          if (!srcs.has(pg.pdf)) srcs.set(pg.pdf, L.PDFDocument.load((await DB.get('pdfs', pg.pdf)).data, { ignoreEncryption: true }));
          const [page] = await out.copyPages(await srcs.get(pg.pdf), [pg.n - 1]);
          out.addPage(page);
          drawStrokesPdf(page, strokes, pj.view[0], pj.view[3]);
        } else {
          // 回転したページは画像にして入れる
          const c = await renderPageImage(pg, strokes, n.paper, 2.5);
          const bytes = await new Promise(r => c.toBlob(b => b.arrayBuffer().then(r), 'image/jpeg', 0.9));
          const img = await out.embedJpg(bytes);
          out.addPage([pg.w, pg.h]).drawImage(img, { x: 0, y: 0, width: pg.w, height: pg.h });
        }
      } else {
        const page = out.addPage([pg.w, pg.h]);
        for (const [x1, y1, x2, y2] of paperLines(pg, n.paper)) {
          page.drawLine({ start: { x: x1, y: pg.h - y1 }, end: { x: x2, y: pg.h - y2 }, thickness: 0.5, color: hexRgb(LINE_GRAY) });

  } catch (e) {
    console.error(e); busy(false); alert('PDFの書き出しに失敗しました: ' + (e.message || e));
  } finally {
    if (!inEditor) clearDocs();
  }
}

// ---------- ページの配置と描画 ----------

}

// ---------- 拡大時の高画質表示 ----------

    act = { ...base, type: 'draw', stroke };
    [act.live, act.liveReg] = makeLive(st, pt, t === 'hl'); drawLive();
  } else if (t === 'er') {
    clearSel();
    act = { ...base, type: 'erase', before: inkMap.get(st.pg.id) || [], last: pt, changed: false };
    act.cursor = el('div', 'er-cursor'); st.el.append(act.cursor);
    eraseTo(pt);
  } else if (t === 'lasso') {
    if (sel && sel.st === st && inBox(pt, sel.box)) {
      const orig = inkMap.get(st.pg.id) || [];
      act = { ...base, type: 'move', start: pt, orig, idx: orig.map(s => sel.set.has(s)), result: orig };
    } else {
      clearSel();
      act = { ...base, type: 'lasso', poly: [pt.x, pt.y] }; [act.live, act.liveReg] = makeLive(st, pt);
    }
  } else if (t === 'crop') {
    clearSel();
    act = { ...base, type: 'crop', poly: [pt.x, pt.y] }; [act.live, act.liveReg] = makeLive(st, pt);
  }
  try { pe.setPointerCapture(e.pointerId); } catch {}
});
window.addEventListener('pointermove', e => {
  if (!act || e.pointerId !== act.id) return;
  e.preventDefault();
  let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  if (!evs.length) evs = [e];
  const st = act.st;
  for (const ev of evs) {
    const pt = toPage(ev, st);
    if (act.type === 'draw') {
      // 手ぶれ・座標の細かいガタつきをならす(前の点に少し引き寄せる)
      const p = act.stroke.p, sm = act.sm || (act.sm = { x: p[0], y: p[1] });
      sm.x += (pt.x - sm.x) * SMOOTH; sm.y += (pt.y - sm.y) * SMOOTH; act.raw = pt;
      const x = r2(sm.x), y = r2(sm.y), dx = x - p[p.length - 2], dy = y - p[p.length - 1];
      if (dx * dx + dy * dy > 0.09) p.push(x, y);
    } else if (act.type === 'lasso' || act.type === 'crop') {
      const p = act.poly, dx = pt.x - p[p.length - 2], dy = pt.y - p[p.length - 1];
      if (dx * dx + dy * dy > 1) p.push(pt.x, pt.y);
    } else if (act.type === 'erase') eraseTo(pt);
  }
  if (act.type === 'move') {
    const pt = toPage(e, st), dx = pt.x - act.start.x, dy = pt.y - act.start.y;
    act.result = act.orig.map((s, i) => act.idx[i] ? { ...s, p: s.p.map((v, j) => r2(v + (j % 2 ? dy : dx))) } : s);
    applyInk(st.pg.id, act.result);
    sel.set = new Set(act.result.filter((_, i) => act.idx[i])); drawSelBox();
  }
  if (act.live) queueLive();
}, { passive: false });
window.addEventListener('pointerup', e => finishAct(e, false));
window.addEventListener('pointercancel', e => finishAct(e, true));

function finishAct(e, cancelled) {
  if (!act || e.pointerId !== act.id) return;
  const a = act, id = a.st.pg.id;
  endLive(); act = null;
  if (a.type === 'draw') {
    if (!cancelled) {
      const p = a.stroke.p;   // ならした分の遅れを取り戻すため、最後はペン先の位置で終える
      if (a.raw && Math.hypot(a.raw.x - p[p.length - 2], a.raw.y - p[p.length - 1]) > 0.3) p.push(a.raw.x, a.raw.y);
      const before = inkMap.get(id) || []; commitInk(id, before, [...before, a.stroke]);
    }
  } else if (a.type === 'erase') {
    a.cursor.remove();
    if (a.changed) pushUndo(id, a.before, inkMap.get(id));
  } else if (a.type === 'move') {
    if (a.result !== a.orig) pushUndo(id, a.orig, a.result);

function cancelAct() { if (act) finishAct({ pointerId: act.id }, true); }

// ---------- 消しゴム ----------
function distSeg(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay, l = vx * vx + vy * vy;
  let t = l ? ((px - ax) * vx + (py - ay) * vy) / l : 0; t = clamp(t, 0, 1);
  const dx = ax + t * vx - px, dy = ay + t * vy - py; return Math.sqrt(dx * dx + dy * dy);
}
function eraseTo(pt) {
  const st = act.st, R = ER_W[set.er.s] / 2, k = st.el.getBoundingClientRect().width / st.pg.w;
  const c = act.cursor.style; c.left = pt.x / st.pg.w * 100 + '%'; c.top = pt.y / st.pg.h * 100 + '%'; c.width = c.height = R * 2 * k + 'px';
  const a = act.last; act.last = pt;
  const strokes = inkMap.get(st.pg.id) || [];
  let changed = false; const out = [];
  for (const s of strokes) {
    const RR = R + s.w / 2, p = s.p;
    let hit = false, cutLink = false; const runs = []; let cur = [];
    for (let i = 0; i < p.length; i += 2) {
      if (distSeg(p[i], p[i + 1], a.x, a.y, pt.x, pt.y) <= RR) { hit = true; if (cur.length) runs.push(cur); cur = []; continue; }
      // 点と点の間を消しゴムが横切った場合もつながりを切る
      if (cur.length && distSeg(pt.x, pt.y, p[i - 2], p[i - 1], p[i], p[i + 1]) <= RR) { hit = true; runs.push(cur); cur = []; }
      cur.push(p[i], p[i + 1]);
    }
    if (!hit) { out.push(s); continue; }
    changed = true; if (cur.length) runs.push(cur);
    for (const r of runs) if (r.length >= 4) out.push({ ...s, p: r });
  }
  if (changed) { applyInk(st.pg.id, out); act.changed = true; }
}

// ---------- 投げ縄 ----------
function pip(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 2; i < poly.length; j = i, i += 2) {
    const xi = poly[i], yi = poly[i + 1], xj = poly[j], yj = poly[j + 1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function finishLasso(a) {
  if (a.poly.length < 6) return;
  const strokes = inkMap.get(a.st.pg.id) || [];
  const chosen = strokes.filter(s => {
    let n = 0, inn = 0;
    for (let i = 0; i < s.p.length; i += 2) { n++; if (pip(s.p[i], s.p[i + 1], a.poly)) inn++; }
    return inn / n >= 0.5;
  });
  if (!chosen.length) return;
  sel = { st: a.st, set: new Set(chosen) };
  drawSelBox();
}
function drawSelBox() {
  if (!sel) return;
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const s of sel.set) {
    for (let i = 0; i < s.p.length; i += 2) {
      x1 = Math.min(x1, s.p[i] - s.w / 2); x2 = Math.max(x2, s.p[i] + s.w / 2);
      y1 = Math.min(y1, s.p[i + 1] - s.w / 2); y2 = Math.max(y2, s.p[i + 1] + s.w / 2);
    }
  }
  const pad = 4; sel.box = { x: x1 - pad, y: y1 - pad, w: x2 - x1 + pad * 2, h: y2 - y1 + pad * 2 };
  const { pg, el: pe } = sel.st;
  if (!sel.boxEl) {
    sel.boxEl = el('div', 'sel-box'); sel.menu = el('div', 'sel-menu');
    const del = el('button', null, '削除');
    del.onclick = () => { const id = sel.st.pg.id, before = inkMap.get(id); commitInk(id, before, before.filter(s => !sel.set.has(s))); clearSel(); };
    sel.menu.append(del); pe.append(sel.boxEl, sel.menu);
  }
  const b = sel.box, s1 = sel.boxEl.style, s2 = sel.menu.style;
  s1.left = b.x / pg.w * 100 + '%'; s1.top = b.y / pg.h * 100 + '%'; s1.width = b.w / pg.w * 100 + '%'; s1.height = b.h / pg.h * 100 + '%';
  s2.left = s1.left; s2.top = s1.top;
}
function inBox(pt, b) { return pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h; }
function clearSel() { if (!sel) return; sel.boxEl && sel.boxEl.remove(); sel.menu && sel.menu.remove(); sel = null; }

// ---------- 切り取り ----------
async function doCrop(a) {
  const p = a.poly; if (p.length < 6) return;
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (let i = 0; i < p.length; i += 2) { x1 = Math.min(x1, p[i]); x2 = Math.max(x2, p[i]); y1 = Math.min(y1, p[i + 1]); y2 = Math.max(y2, p[i + 1]); }
  const pg = a.st.pg;
  x1 = Math.max(0, x1); y1 = Math.max(0, y1); x2 = Math.min(pg.w, x2); y2 = Math.min(pg.h, y2);
  if (x2 - x1 < 8 || y2 - y1 < 8) return;
  busy('切り取っています…');
  try {
    const reg = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 }, k = Math.min(4, 2400 / Math.max(reg.w, reg.h));
    const c = await renderPageImage(pg, inkMap.get(pg.id) || [], cur.note.paper, k, reg);
    const ctx = c.getContext('2d');
    ctx.globalCompositeOperation = 'destination-in';
    ctx.setTransform(k, 0, 0, k, -reg.x * k, -reg.y * k);
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]); ctx.closePath(); ctx.fill();
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    c.width = c.height = 0;
    busy(false);
    showCrop(blob);
  } catch (e) { busy(false); console.error(e); alert('切り取りに失敗しました: ' + e.message); }
}
function showCrop(blob) {
  const url = URL.createObjectURL(blob);
  const body = el('div'), img = el('img', 'preview'); img.src = url; body.append(img);
  const row = el('div', 'row');
  const copy = el('button', 'btn primary', 'コピー'), share = el('button', 'btn', '共有・保存');
  copy.onclick = async () => {
    try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); toast('コピーしました'); }
    catch (e) { toast('コピーできませんでした。「共有・保存」を使ってください'); }
  };
  share.onclick = () => shareFile(blob, '切り取り.png');
  row.append(copy, share); body.append(row);
  sheet('切り取り', [], body);
  const bg = document.body.lastChild;
  new MutationObserver((_, ob) => { if (!bg.isConnected) { URL.revokeObjectURL(url); ob.disconnect(); } }).observe(document.body, { childList: true });
}

// ---------- 指の操作(ピンチ・2本指タップ・Pencilでのスクロール防止) ----------
const isStylus = t => t.touchType === 'stylus';
scroller.addEventListener('touchstart', e => {
  if ([...e.changedTouches].some(isStylus)) { if (!e.target.closest('.sel-menu')) e.preventDefault(); return; }
  const ts = [...e.touches].filter(t => !isStylus(t));
  if (ts.length === 2 && !pinch) {
    if (act && act.pointerType === 'touch') cancelAct();
    startPinch(ts); e.preventDefault();
  }
}, { passive: false });
scroller.addEventListener('touchmove', e => {
  if ([...e.changedTouches].some(isStylus)) { e.preventDefault(); return; }
  if (pinch) { e.preventDefault(); const ts = [...e.touches].filter(t => !isStylus(t)); if (ts.length >= 2) movePinch(ts); }
}, { passive: false });
const touchEnd = e => { if (pinch && [...e.touches].filter(t => !isStylus(t)).length < 2) endPinch(); };
scroller.addEventListener('touchend', touchEnd);
scroller.addEventListener('touchcancel', touchEnd);
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());

const center = ts => ({ x: (ts[0].clientX + ts[1].clientX) / 2, y: (ts[0].clientY + ts[1].clientY) / 2 });
const dist = ts => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY) || 1;
function startPinch(ts) {
  const c = center(ts), rect = scroller.getBoundingClientRect();
  const ox = scroller.scrollLeft + c.x - rect.left, oy = scroller.scrollTop + c.y - rect.top;
  pinch = { d0: dist(ts), c0: c, c, s: 1, t0: Date.now(), moved: 0 };
  pagesEl.style.transformOrigin = `${ox - pagesEl.offsetLeft}px ${oy - pagesEl.offsetTop}px`;
}
function movePinch(ts) {
  const c = center(ts);
  pinch.s = clamp(zoom * dist(ts) / pinch.d0, 0.5, 4) / zoom; pinch.c = c;
  pinch.moved = Math.max(pinch.moved, Math.hypot(c.x - pinch.c0.x, c.y - pinch.c0.y), Math.abs(dist(ts) - pinch.d0));
  pagesEl.style.transform = `translate(${c.x - pinch.c0.x}px,${c.y - pinch.c0.y}px) scale(${pinch.s})`;
}
function endPinch() {
  const p = pinch; pinch = null;
  pagesEl.style.transform = '';
  if (Date.now() - p.t0 < 300 && p.moved < 12) { undo(); return; }   // 2本指タップで元に戻す
  zoomTo(zoom * p.s, p.c0.x, p.c0.y, p.c.x, p.c.y);
}
function zoomTo(z, cx, cy, cx1 = cx, cy1 = cy) {
  z = clamp(z, 0.5, 4);
  const rect = scroller.getBoundingClientRect();
  const ox = scroller.scrollLeft + cx - rect.left, oy = scroller.scrollTop + cy - rect.top, k = z / zoom;
  zoom = z; layout();
  scroller.scrollLeft = ox * k - (cx1 - rect.left);
  scroller.scrollTop = oy * k - (cy1 - rect.top);
}
// パソコンで試すとき用: Ctrl+ホイールで拡大
scroller.addEventListener('wheel', e => { if (e.ctrlKey) { e.preventDefault(); zoomTo(zoom * Math.exp(-e.deltaY / 300), e.clientX, e.clientY); } }, { passive: false });

// ---------- ページ番号・ページ操作 ----------
function currentIndex() {
  const mid = scroller.scrollTop + scroller.clientHeight / 2; let best = 0;
  cur.note.pages.forEach((pg, i) => { const st = pstate.get(pg.id); if (st && st.el.offsetTop <= mid) best = i; });
  return best;
}
let pnQueued = false;
function updatePageNo() { if (cur.note) $('#pageno').textContent = `${currentIndex() + 1} / ${cur.note.pages.length}`; }
scroller.addEventListener('scroll', () => {
  if (pnQueued) return; pnQueued = true;
  requestAnimationFrame(() => { pnQueued = false; updatePageNo(); });
  scheduleDetails();
}, { passive: true });
function scrollToPage(i) { const pg = cur.note.pages[i]; const st = pg && pstate.get(pg.id); if (st) scroller.scrollTop = st.el.offsetTop - 12; updatePageNo(); }
async function insertBlankAfter(i) {
  const ref = cur.note.pages[i] || A4;
  const pg = { id: uid(), type: 'blank', w: ref.w, h: ref.h };
  cur.note.pages.splice(i + 1, 0, pg); inkMap.set(pg.id, []);
  await saveNote(); buildPages(); scrollToPage(i + 1);
  if (!$('#panel').hidden) renderPanel();
  toast(`${i + 2}ページ目に空白ページを追加しました`);
}
async function movePage(i, d) {
  const ps = cur.note.pages, j = i + d; if (j < 0 || j >= ps.length) return;
  [ps[i], ps[j]] = [ps[j], ps[i]];
  await saveNote(); buildPages(); scrollToPage(j); renderPanel();
}
async function deletePage(i) {
  const ps = cur.note.pages;
  if (ps.length === 1) { toast('最後の1ページは削除できません'); return; }
  if (!confirm(`${i + 1}ページ目を削除しますか？\n書き込みも消え、元に戻せません。`)) return;
  const [pg] = ps.splice(i, 1);
  inkMap.delete(pg.id); dirty.delete(pg.id); thumbCache.delete(pg.id);
  undoStack = undoStack.filter(u => u.pageId !== pg.id); redoStack = redoStack.filter(u => u.pageId !== pg.id); updateUndo();
  await DB.del('ink', pg.id); await saveNote();
  buildPages(); scrollToPage(Math.min(i, ps.length - 1)); renderPanel();
}

// ページ一覧パネル
let panelGen = 0;
function renderPanel() {
  const list = $('#plist'); list.innerHTML = '';
  const gen = ++panelGen, ci = currentIndex(), imgs = [];
  cur.note.pages.forEach((pg, i) => {
    const item = el('div', 'pi' + (i === ci ? ' cur' : ''));
    const box = el('button', 'pimg'); box.style.aspectRatio = `${pg.w} / ${pg.h}`;
    box.onclick = () => { scrollToPage(i); $('#panel').hidden = true; };
    const pb = el('div', 'pb');
    pb.append(el('b', null, `${i + 1}ページ` + (pg.type === 'blank' ? '(空白)' : '')));
    const btn = (label, fn, dis) => { const b = el('button', null, label); b.onclick = fn; if (dis) b.disabled = true, b.style.opacity = .35; pb.append(b); };
    btn('↑ 上へ', () => movePage(i, -1), i === 0);
    btn('↓ 下へ', () => movePage(i, 1), i === cur.note.pages.length - 1);
    btn('＋ 後ろに空白', () => insertBlankAfter(i));
    btn('削除', () => deletePage(i));
    item.append(box, pb); list.append(item); imgs.push([pg, box]);
  });
  (async () => {
    for (const [pg, box] of imgs) {
      if (gen !== panelGen || $('#panel').hidden) return;
      let url = thumbCache.get(pg.id);
      if (!url) {
        try { const c = await renderPageImage(pg, inkMap.get(pg.id) || [], cur.note.paper, 220 / pg.w); url = c.toDataURL('image/jpeg', 0.7); c.width = c.height = 0; thumbCache.set(pg.id, url); }
        catch { continue; }
      }
      if (gen !== panelGen) return;
      const img = el('img'); img.src = url; img.alt = ''; box.append(img);
    }
  })();
  const curItem = list.children[ci]; if (curItem) curItem.scrollIntoView({ block: 'center' });
}

function editorMenu() {
  const n = cur.note;
  sheet(n.title, [
    { label: 'PDFとして書き出す', fn: async () => { await flushInk(); exportPDF(n); } },
    { label: `空白ページの用紙：${(PAPERS[n.paper] || PAPERS['ruled-m']).name}`, fn: () => {
      sheet('空白ページの用紙', Object.entries(PAPERS).map(([k, p]) => ({ label: p.name + (k === n.paper ? ' ✓' : ''), fn: async () => { n.paper = k; await saveNote(); buildPages(); } })));
    } },
    { label: `指で書く：${set.finger ? 'オン' : 'オフ'}(Pencilがないとき用)`, fn: () => {
      set.finger = !set.finger; saveSet(); scroller.style.touchAction = set.finger ? 'none' : '';
      toast(set.finger ? '指で書けます(スクロールは2本指)' : '指はスクロールに戻りました');
    } },
    { label: 'ノートの名前を変える', fn: async () => { const t = prompt('ノートの名前', n.title); if (t && t.trim()) { n.title = t.trim(); $('#etitle').textContent = n.title; await saveNote(); } } },
  ]);
}

// ---------- ボタンの割り当て ----------
$('#importBtn').onclick = () => $('#pdfInput').click();
$('#pdfInput').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) importPDFs(fs); };
$('#restoreInput').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) restoreBackup(f); };
$('#newBtn').onclick = newBlankNote;
$('#homeMenu').onclick = homeMenu;
$('#newFolderBtn').onclick = newFolder;
$('#selectBtn').onclick = () => setSelecting(!selecting);
$('#selAll').onclick = () => {
  const keys = shownKeys();
  if (selected.size === keys.length) selected.clear(); else keys.forEach(k => selected.add(k));
  renderHome();
};
$('#selMove').onclick = moveSelected;
$('#selDel').onclick = deleteSelected;
$('#backBtn').onclick = closeEditor;
$('#undoBtn').onclick = undo;
$('#redoBtn').onclick = redo;
$('#addPageBtn').onclick = () => insertBlankAfter(currentIndex());
$('#pagesBtn').onclick = () => { $('#panel').hidden = false; renderPanel(); };
$('#panelClose').onclick = () => $('#panel').hidden = true;
$('#addLastBtn').onclick = () => insertBlankAfter(cur.note.pages.length - 1);
$('#editorMenu').onclick = editorMenu;
$('#etitle').onclick = () => editorMenu();
document.addEventListener('keydown', e => {
  if (!cur.note || !(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z') return;
  e.preventDefault(); e.shiftKey ? redo() : undo();
});
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (cur.note) layout(); }, 150); });

// ---------- 起動 ----------
(async () => {
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  $('#hint').hidden = standalone;
  if (set.finger) scroller.style.touchAction = 'none';
  try { await DB.open(); } catch (e) { alert('保存領域を開けませんでした: ' + e.message); return; }
  refreshHome();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
